aid: unrivaled-sports
name: Unrivaled Sports
description: >-
  Unrivaled Sports is a youth sports platform and experience operator founded in March 2024 by Josh
  Harris and David Blitzer (Harris Blitzer Sports & Entertainment) with a strategic investment from
  The Chernin Group, later joined by DICK'S Sporting Goods and Under Armour as strategic investors.
  The company owns and operates a portfolio of youth sports destinations, tournaments and camps
  across baseball, softball, flag football and action sports — including Ripken Baseball, Cooperstown
  All Star Village, Baseball Factory, Softball Factory, Diamond Nation, Big League Dreams, Sports
  Force Parks, ForeverLawn Sports Complex at the Pro Football Hall of Fame Village, Rocker B Ranch,
  Unrivaled Flag, Under the Lights Flag Football and the We Are Camp action-sports properties
  (High Cascade, Windells, Snöbahn, Seek Skate Camp, Milepost 35). It reports 15 venues, 2 million
  annual visitors and 800,000 athletes served. It is a venue and event operator rather than a
  software company: as of 2026-09-02 it publishes no developer program, no public API, and no
  machine-readable API contract on any of its own or its portfolio brands' hosts.
